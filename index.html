    <script>
        // ============================================================
        // 1. LUCIDE ICONS - INISIALISASI
        // ============================================================
        var iconInitAttempts = 0;
        var maxIconAttempts = 10;

        function initIcons() {
            try {
                if (typeof lucide !== 'undefined' && lucide.createIcons) {
                    lucide.createIcons();
                    iconInitAttempts = 0;
                    return true;
                }
            } catch (e) {
                console.warn('Gagal inisialisasi Lucide:', e);
            }
            return false;
        }

        function tryInitIcons() {
            if (initIcons()) return;
            iconInitAttempts++;
            if (iconInitAttempts < maxIconAttempts) {
                setTimeout(tryInitIcons, 300);
            }
        }

        // ============================================================
        // 2. DOM READY
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            try {
                // Inisialisasi ikon
                tryInitIcons();

                // Mobile menu
                var btn = document.getElementById('mobile-menu-btn');
                var menu = document.getElementById('mobile-menu');
                if (btn && menu) {
                    btn.addEventListener('click', function() {
                        menu.classList.toggle('hidden');
                    });
                    document.querySelectorAll('#mobile-menu a').forEach(function(link) {
                        link.addEventListener('click', function() {
                            menu.classList.add('hidden');
                        });
                    });
                }

                // Navbar scroll
                var navbar = document.getElementById('navbar');
                if (navbar) {
                    window.addEventListener('scroll', function() {
                        if (window.scrollY > 20) {
                            navbar.classList.add('nav-blur');
                            navbar.classList.remove('bg-transparent', 'py-3');
                            navbar.classList.add('py-2');
                        } else {
                            navbar.classList.remove('nav-blur', 'py-2');
                            navbar.classList.add('bg-transparent', 'py-3');
                        }
                    });
                }

                // Scroll Animations
                if ('IntersectionObserver' in window) {
                    var observer = new IntersectionObserver(function(entries) {
                        entries.forEach(function(entry) {
                            if (entry.isIntersecting) {
                                entry.target.classList.add('is-visible');
                                if (entry.target.classList.contains('progress-item')) {
                                    var fill = entry.target.querySelector('.progress-bar-fill');
                                    if (fill) {
                                        var width = fill.style.getPropertyValue('--progress-width');
                                        setTimeout(function() {
                                            fill.style.width = width;
                                        }, 100);
                                    }
                                }
                            }
                        });
                    }, {
                        threshold: 0.2,
                        rootMargin: '0px 0px -50px 0px'
                    });

                    document.querySelectorAll('.fade-in-up, .progress-item').forEach(function(el) {
                        observer.observe(el);
                    });
                } else {
                    document.querySelectorAll('.fade-in-up, .progress-item').forEach(function(el) {
                        el.classList.add('is-visible');
                    });
                    document.querySelectorAll('.progress-bar-fill').forEach(function(fill) {
                        var width = fill.style.getPropertyValue('--progress-width');
                        if (width) {
                            fill.style.width = width;
                        }
                    });
                }

                // Chat input Enter key
                var chatInput = document.getElementById('chat-input');
                if (chatInput) {
                    chatInput.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') {
                            sendMessage();
                        }
                    });
                }

                // Load saved language
                var savedLang = localStorage.getItem('preferred_lang') || 'id';
                setLanguage(savedLang);

            } catch (e) {
                console.error('Error pada DOMContentLoaded:', e);
            }
        });

        // ============================================================
        function openImageModal(src) {
            try {
                var modal = document.getElementById('imageModal');
                var img = document.getElementById('modalImage');
                if (modal && img) {
                    img.src = src;
                    modal.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
            } catch (e) {
                console.error('Error openImageModal:', e);
            }
        }

        function closeImageModal(e) {
            try {
                if (e && e.target !== e.currentTarget && e.target.tagName !== 'BUTTON') return;
                var modal = document.getElementById('imageModal');
                if (modal) {
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                }
            } catch (e) {
                console.error('Error closeImageModal:', e);
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                var modal = document.getElementById('imageModal');
                if (modal) {
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                }
            }
        });

        function setLanguage(lang) {
            try {
                var elements = document.querySelectorAll('[data-i18n]');
                elements.forEach(function(el) {
                    var key = el.getAttribute('data-i18n');
                    var translation = translations[lang]?.[key];
                    if (translation) {
                        el.innerHTML = translation;
                    }
                });

                document.querySelectorAll('.lang-btn').forEach(function(btn) {
                    btn.classList.remove('active');
                    if (btn.dataset.lang === lang) {
                        btn.classList.add('active');
                    }
                });

                localStorage.setItem('preferred_lang', lang);
                setTimeout(tryInitIcons, 100);
            } catch (e) {
                console.error('Error setLanguage:', e);
            }
        }

        // ============================================================
        // 5. MUTATION OBSERVER
        // ============================================================
        if (window.MutationObserver) {
            var iconObserver = new MutationObserver(function() {
                tryInitIcons();
            });

            document.addEventListener('DOMContentLoaded', function() {
                if (document.body) {
                    iconObserver.observe(document.body, {
                        childList: true,
                        subtree: true,
                        attributes: false
                    });
                }
            });

            setTimeout(function() {
                if (iconObserver) {
                    iconObserver.disconnect();
                }
            }, 10000);
        }

        setTimeout(tryInitIcons, 1000);
        setTimeout(tryInitIcons, 3000);

        // ============================================================

        var chatOpen = false;

        var chatInput = document.getElementById('chat-input');
        var chatSendBtn = document.getElementById('chat-send-btn');
        var chatToggle = document.getElementById('chat-toggle');
        var chatWindow = document.getElementById('chat-window');
        var chatBadge = document.getElementById('chat-badge');

        var badgeHidden = false;

        function toggleChat() {
            try {
                chatOpen = !chatOpen;
                if (chatOpen) {
                    chatWindow.classList.add('open');
                    chatToggle.classList.add('active');
                    if (!badgeHidden) {
                        chatBadge.style.display = 'none';
                        badgeHidden = true;
                    }
                    setTimeout(function() {
                        if (chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
                    }, 100);
                } else {
                    chatWindow.classList.remove('open');
                    chatToggle.classList.remove('active');
                }
            } catch (e) {
                console.error('Error toggleChat:', e);
            }
        }

        // ==== INFORMASI TENTANG ANDA ====
        var aboutVarian =
            "Nama: Varian Rhesa\n" +
            "Pekerjaan: Junior Software Engineer\n" +
            "Pendidikan: Mahasiswa Teknologi Rekayasa Komputer di Politeknik Negeri Samarinda (2022-sekarang). Sebelumnya SMK Negeri 7 Samarinda jurusan Rekayasa Perangkat Lunak (2019-2022).\n" +
            "Keahlian: Python, Java, C++, JavaScript, PHP, Dart, Visual Basic, Flutter, HTML/CSS, Bootstrap, REST API, PWA, Arduino IDE, ESP32, Microcontroller C++, Robotika, Git, Linux, Docker, Cloudflare Workers, Firebase.\n" +
            "Pengalaman: Magang di Balai Monitor Spektrum Frekuensi Radio Kelas I Samarinda (Feb-Mei 2026) sebagai Full Stack Developer. Membuat PWA monitoring spektrum, Firebase Realtime Database, Admin Dashboard, QR Code system, PDF & CSV export, AI chatbot dengan Llama API, deploy Cloudflare Pages. Juga magang online di PPTIK ITB (2020).\n" +
            "Prestasi: Juara 3 Kontes Robot Cerdas Kalimantan Timur 2023.\n" +
            "Lokasi: Samarinda, Kalimantan Timur.\n" +
            "Bahasa: Indonesia (native), English (B2), Mandarin (HSK1).\n" +
            "Sertifikasi: Dicoding Android, CCNAv7 Cisco.\n" +
            "Hobi: Kopi, membaca, bersepeda, musik.\n" +
            "Filosofi: Kode terbaik adalah yang mengerti manusia di balik layar.";

        // ==== GROQ API ====
        // 🔑 Ganti dengan API Key Anda dari https://console.groq.com/keys
        var GROQ_API_KEY =
            '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';

        var GROQ_MODEL = 'llama-3.1-70b-versatile';
        var isTyping = false;

        function addMessage(text, isUser) {
            try {
                if (!chatMessages) return;
                var msgDiv = document.createElement('div');
                msgDiv.className = 'message ' + (isUser ? 'user' : 'bot');
                msgDiv.textContent = text;
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (e) {
                console.error('Error addMessage:', e);
            }
        }

        function addTypingIndicator() {
            try {
                if (!chatMessages) return;
                var typingDiv = document.createElement('div');
                typingDiv.className = 'message typing';
                typingDiv.id = 'typing-indicator';
                typingDiv.innerHTML =
                    `
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                `;
                chatMessages.appendChild(typingDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (e) {
                console.error('Error addTypingIndicator:', e);
            }
        }

        function removeTypingIndicator() {
            try {
                var typing = document.getElementById('typing-indicator');
                if (typing) {
                    typing.remove();
                }
            } catch (e) {
                console.error('Error removeTypingIndicator:', e);
            }
        }

        function getResponseFromGroq(userMessage) {
            return new Promise(function(resolve, reject) {
                if (!GROQ_API_KEY || GROQ_API_KEY.trim() === '') {
                    reject(new Error('API Key Groq belum diatur.'));
                    return;
                }

                var systemPrompt =
                    "Anda adalah Rhesa AI, asisten virtual yang ramah dan informatif. Tugas Anda adalah menjawab pertanyaan tentang Varian Rhesa berdasarkan informasi yang diberikan. Jawab dengan singkat, jelas, dan dalam bahasa Indonesia. Jika pertanyaan tidak terkait dengan Varian Rhesa, katakan 'Maaf, saya hanya bisa menjawab pertanyaan tentang Varian Rhesa.'";

                var userPrompt = "Pertanyaan: " + userMessage;

                var url = 'https://api.groq.com/openai/v1/chat/completions';

                var payload = {
                    model: GROQ_MODEL,
                    messages: [
                        { role: 'system', content: systemPrompt + '\n\nInformasi tentang Varian Rhesa:\n' +
                            aboutVarian },
                        { role: 'user', content: userPrompt }
                    ],
                    temperature: 0.7,
                    max_tokens: 300,
                    top_p: 0.9,
                    stream: false
                };

                fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + GROQ_API_KEY.trim()
                        },
                        body: JSON.stringify(payload)
                    })
                    .then(function(response) {
                        if (!response.ok) {
                            return response.json().then(function(err) {
                                throw new Error(err.error?.message || 'HTTP ' + response.status);
                            });
                        }
                        return response.json();
                    })
                    .then(function(data) {
                        if (data && data.choices && data.choices.length > 0) {
                            var text = data.choices[0].message.content || '';
                            text = text.replace(/^Pertanyaan:.*?\n/, '');
                            text = text.replace(/^Jawab:/, '');
                            text = text.trim();
                            if (!text || text.length < 2) {
                                throw new Error('Respons kosong atau terlalu pendek');
                            }
                            resolve(text);
                        } else {
                            throw new Error('Respons tidak valid dari Groq API');
                        }
                    })
                    .catch(function(err) {
                        reject(err);
                    });
            });
        }

        function sendMessage() {
            try {
                if (!chatInput) return;
                var text = chatInput.value.trim();
                if (!text || isTyping) return;

                addMessage(text, true);
                chatInput.value = '';
                if (chatSendBtn) chatSendBtn.disabled = true;

                isTyping = true;
                addTypingIndicator();

                getResponseFromGroq(text)
                    .then(function(response) {
                        removeTypingIndicator();
                        addMessage(response, false);
                        isTyping = false;
                        if (chatSendBtn) chatSendBtn.disabled = false;
                    })
                    .catch(function(error) {
                        removeTypingIndicator();
                        console.error('Chat error:', error);
                        var fallbackMsg =
                            "Maaf, saya sedang tidak bisa terhubung ke AI. Pastikan API Key Groq valid dan jaringan stabil. Silakan coba lagi nanti. 😊";
                        if (error.message && error.message.includes('API Key')) {
                            fallbackMsg =
                                "🔑 API Key Groq tidak valid atau belum diatur. Dapatkan key gratis di console.groq.com/keys";
                        } else if (error.message && error.message.includes('Access denied')) {
                            fallbackMsg =
                                "🔒 Akses ke Groq API ditolak. Periksa jaringan Anda (VPN/Proxy) atau coba gunakan data seluler.";
                        }
                        addMessage(fallbackMsg, false);
                        isTyping = false;
                        if (chatSendBtn) chatSendBtn.disabled = false;
                    });
            } catch (e) {
                console.error('Error sendMessage:', e);
                removeTypingIndicator();
                isTyping = false;
                if (chatSendBtn) chatSendBtn.disabled = false;
            }
        }

        // Enter key support (sudah diatur di DOMContentLoaded)
        // Auto focus input saat chat dibuka
        if (window.MutationObserver) {
            var chatObserver = new MutationObserver(function() {
                if (chatWindow && chatWindow.classList.contains('open')) {
                    setTimeout(function() {
                        if (chatInput) chatInput.focus();
                    }, 200);
                }
            });
            if (chatWindow) {
                chatObserver.observe(chatWindow, {
                    attributes: true,
                    attributeFilter: ['class']
                });
            }
        }

        // Cek API key
        setTimeout(function() {
            try {
                if (!GROQ_API_KEY || GROQ_API_KEY.trim() === '') {
                    var warning = document.createElement('div');
                    warning.className = 'api-warning';
                    warning.innerHTML = '⚠️ API Key Groq belum diatur. Tambahkan di kode (GROQ_API_KEY).';
                    if (chatMessages) {
                        chatMessages.appendChild(warning);
                    }
                } else {
                    console.log('✅ Groq API Key terdeteksi! Model:', GROQ_MODEL);
                }
            } catch (e) {
                console.error('Error checking API key:', e);
            }
        }, 500);

        console.log('🧠 Rhesa AI siap menggunakan Groq API! Model:', GROQ_MODEL);
    </script>

</body>
